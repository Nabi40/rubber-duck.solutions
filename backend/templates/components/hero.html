<!-- ================= HERO COMPONENT ================= -->
<section id="hero" class="px-4 pb-4 md:px-6 pt-2">
  <div id="hero-card" class="relative mx-auto min-h-[480px] w-full max-w-[1240px] overflow-hidden rounded-[18px] bg-gradient-to-b from-[#d0d4ea] to-[#97a0ea] px-4 py-6 md:px-6 md:py-6">
    
    <!-- Landing View (Before Image Selected) -->
    <div id="landing-view">
      <img src="/static/images/bg-image10.png" alt="" class="pointer-events-none absolute left-2 top-12 hidden h-[140px] w-[190px] -rotate-[15deg] rounded-2xl object-cover md:block lg:left-7 lg:h-[170px] lg:w-[240px]">
      <img src="/static/images/bg-image2.png" alt="" class="pointer-events-none absolute right-10 top-16 hidden h-[105px] w-[180px] rotate-[18deg] object-cover opacity-95 md:block">
      <img src="/static/images/bg-image3.png" alt="" class="pointer-events-none absolute bottom-7 left-8 hidden h-[125px] w-[165px] rotate-[14deg] rounded-2xl object-cover md:block lg:h-[155px] lg:w-[210px]">
      <img src="/static/images/bg-image40.png" alt="" class="pointer-events-none absolute bottom-7 right-8 hidden h-[125px] w-[165px] rotate-[14deg] rounded-2xl object-cover md:block lg:h-[155px] lg:w-[210px]">

      <div class="relative mx-auto mt-4 flex max-w-[660px] flex-col items-center text-center">
        <h2 class="text-3xl font-semibold leading-tight text-[#22232c] md:text-[46px]">
          Drag, Drop and print<br>passport size photo
        </h2>
        <p class="mt-2 text-xs text-[#5c6176] md:text-[20px]">
          Instantly get clean, high-quality images with sharp, pixel-perfect precision
        </p>

        <!-- Dropzone as native clickable label -->
        <label for="file-input" id="dropzone" class="mt-6 block w-full max-w-[380px] cursor-pointer rounded-2xl bg-[#f4f4f4] px-4 py-12 text-center transition hover:bg-white hover:shadow-lg border-2 border-transparent">
          <input type="file" id="file-input" accept="image/*" class="hidden">
          <span id="upload-btn" class="pointer-events-none mx-auto inline-flex items-center justify-center rounded-full bg-[#7f8ef0] px-8 py-2 text-xl font-medium text-white shadow-md hover:bg-[#6c7de8] transition">
            Upload Image
          </span>
          <p class="mt-2 text-xs text-[#585858]">Or drop an image here</p>
        </label>
      </div>
    </div>

    <!-- Editor View (After Image Selected) -->
    <div id="editor-view" class="hidden">
      <!-- Toolbar -->
      <div id="editor-toolbar" class="mx-auto mt-1 w-full max-w-[960px] rounded-2xl sm:rounded-full bg-[#f2f2f0] px-3 py-1.5 shadow-sm">
        <div class="flex items-center justify-between gap-3">
          <div class="flex items-center gap-1.5 shrink-0" id="tab-buttons">
            <button id="tab-background" data-tab="Background" class="tab-btn inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs sm:text-[12.5px] font-medium bg-[#7f8ef0] text-white whitespace-nowrap transition-colors">
              <span>🎨</span>
              <span>Background</span>
            </button>
            <button id="tab-attire" data-tab="Formal Attire" class="tab-btn inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs sm:text-[12.5px] font-medium text-[#505050] hover:bg-[#e5e5e5] whitespace-nowrap transition-colors hidden">
              <span>👔</span>
              <span>Formal Attire</span>
            </button>
            <button id="tab-passport" data-tab="Passport Size Image" class="tab-btn inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs sm:text-[12.5px] font-medium text-[#505050] hover:bg-[#e5e5e5] whitespace-nowrap transition-colors hidden">
              <span>🪪</span>
              <span>Passport Size Image</span>
            </button>
            <button id="tab-stamp" data-tab="Passport-Stamp Images" class="tab-btn inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs sm:text-[12.5px] font-medium text-[#505050] hover:bg-[#e5e5e5] whitespace-nowrap transition-colors hidden">
              <span>📑</span>
              <span>Passport-Stamp Images</span>
            </button>
            <button id="tab-custom" data-tab="Custom Size Images" class="tab-btn inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs sm:text-[12.5px] font-medium text-[#505050] hover:bg-[#e5e5e5] whitespace-nowrap transition-colors hidden">
              <span>📐</span>
              <span>Custom Size Images</span>
            </button>
          </div>

          <div class="flex items-center gap-2 shrink-0">
            <button id="download-btn" class="rounded-full bg-[#7f8ef0] px-4 py-1 text-xs font-semibold text-white shadow hover:bg-[#6c7de8] transition disabled:opacity-40 whitespace-nowrap">
              Download
            </button>
          </div>
        </div>
      </div>

      <!-- Main Editor Grid -->
      <div id="editor-grid" class="mx-auto mt-4 grid w-full max-w-[420px] gap-4 items-stretch">
        
        <!-- Left: Preview & Cropper Card -->
        <div id="left-preview-card" class="relative overflow-hidden rounded-[16px] bg-[#f4f4f4] p-3.5 shadow-sm flex flex-col justify-between items-center h-[420px] w-full">
          <button id="reset-btn" title="Reset image" class="absolute right-2.5 top-2.5 z-30 flex h-6 w-6 items-center justify-center rounded-full border border-[#9a9a9a] bg-white text-xs font-bold text-[#636363] hover:bg-[#eaeaea] transition">
            &times;
          </button>

          <!-- Top Header with Photo Preview title and Eraser Tool button -->
          <div class="h-7 w-full flex items-center justify-between mb-2">
            <span class="text-[11px] font-semibold text-[#5c6176] uppercase tracking-wider">Photo Preview</span>

            <!-- Eraser Quick Action in header (available during edit) -->
            <div id="eraser-tools" class="hidden flex items-center gap-1.5 mr-7">
              <button type="button" id="eraser-toggle-btn" class="flex items-center gap-1.5 px-3 py-1 rounded-full border border-indigo-200 bg-gradient-to-r from-indigo-50 via-purple-50 to-pink-50 text-[11.5px] font-bold text-indigo-700 hover:from-indigo-100 hover:to-pink-100 hover:border-indigo-400 hover:scale-105 transition-all shadow-xs cursor-pointer">
                <span class="text-xs">🧽</span>
                <span>Eraser</span>
              </button>
              <button type="button" id="eraser-undo-btn" title="Undo Erase" class="hidden h-6 w-6 flex items-center justify-center rounded-full border border-indigo-200 bg-indigo-50 text-xs font-bold text-indigo-700 hover:bg-indigo-100 hover:scale-110 transition-all shadow-xs cursor-pointer">
                <svg class="w-3.5 h-3.5 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 10h10a5 5 0 015 5v2m-15-7l4-4m-4 4l4 4"/></svg>
              </button>
            </div>
          </div>

          <!-- Image Container Inside Standard Box -->
          <div class="rounded-md border border-[#d2d2d2] bg-[#ececec] p-2.5 flex flex-col items-center justify-center h-[340px] w-full max-w-[240px] mx-auto my-auto relative">
            <div id="image-box" class="relative mx-auto overflow-hidden rounded-lg bg-[#5f9de8] shadow-inner" style="width: 100%; max-width: 220px; aspect-ratio: 1.7 / 2.1;">
              
              <!-- Crop Stage -->
              <div id="crop-stage" class="hidden h-full w-full">
                <img id="cropper-target" src="" alt="To Crop" class="max-h-full max-w-full">
              </div>

              <!-- Result Preview Image & Attire Overlay & Eraser Canvas -->
              <div id="preview-stage" class="relative h-full w-full flex items-center justify-center overflow-hidden">
                <img id="preview-img" src="" alt="Preview" class="h-full w-full object-contain pointer-events-none">
                <canvas id="eraser-canvas" class="absolute left-0 top-0 h-full w-full object-contain hidden z-30 touch-none cursor-crosshair"></canvas>
                <img id="attire-overlay-img" src="" alt="Formal Attire" class="absolute left-0 top-0 h-full w-full object-contain hidden z-10 select-none cursor-grab active:cursor-grabbing touch-none">
                <div id="attire-drag-hint" class="pointer-events-none absolute top-2 left-2 z-20 hidden px-2 py-0.5 rounded-full bg-black/60 text-[10px] font-medium text-white shadow-sm flex items-center gap-1">
                  <span>✋ Drag to move</span>
                </div>
                <div id="eraser-mode-hint" class="pointer-events-none absolute top-2 left-2 z-20 hidden px-2 py-0.5 rounded-full bg-red-600/80 text-[10px] font-medium text-white shadow-sm flex items-center gap-1">
                  <span>🧽 Brush to erase excess</span>
                </div>
              </div>

              <!-- Loading Overlay -->
              <div id="loading-overlay" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-white/70 backdrop-blur-xs hidden">
                <div class="flex items-center gap-2 rounded-full bg-slate-900 px-4 py-2 text-xs font-medium text-white shadow-lg">
                  <svg class="h-3.5 w-3.5 animate-spin text-white" viewBox="0 0 24 24" fill="none">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                  </svg>
                  <span id="loading-label">Removing background...</span>
                </div>
              </div>
            </div>

            <!-- Eraser Floating Controls -->
            <div id="eraser-controls" class="hidden mt-1.5 w-full flex items-center justify-between px-2 py-1 rounded-lg bg-white border border-[#e2e4ee] shadow-2xs">
              <div class="flex items-center gap-1.5 flex-1">
                <span class="text-[9px] font-bold text-gray-500 uppercase">Brush:</span>
                <input type="range" id="eraser-size-slider" min="6" max="45" value="18" step="1" class="w-20 accent-[#7f8ef0] h-1.5 cursor-pointer">
                <span id="eraser-size-label" class="text-[9px] font-bold text-gray-700">18px</span>
              </div>
              <button type="button" id="eraser-done-btn" class="px-2 py-0.5 rounded bg-[#7f8ef0] text-white text-[10px] font-semibold hover:bg-[#6c7de8] transition">Done</button>
            </div>
          </div>

          <!-- Cropper Controls (Zoom & Confirm) -->
          <div id="cropper-controls" class="mt-2 flex flex-col items-center gap-1.5 hidden w-full">
            <div class="flex items-center gap-2">
              <span class="text-[11px] text-gray-500 font-medium">Zoom:</span>
              <input type="range" id="zoom-slider" min="1" max="3" step="0.05" value="1" class="w-36 accent-[#7f8ef0]">
            </div>
            <button id="crop-confirm-btn" class="rounded-full bg-[#7f8ef0] px-5 py-1 text-xs font-semibold text-white shadow hover:bg-[#6c7de8] transition">
              Crop &amp; Continue
            </button>
          </div>
        </div>

        <!-- Right: Palette or Sizes (Shown after Crop & Continue) -->
        <div id="right-panel" class="hidden h-full">
          <!-- Background Palette Panel -->
          <div id="palette-panel" class="rounded-[16px] bg-[#f4f4f4] p-3.5 shadow-sm flex flex-col justify-between h-[420px] w-full">
            <div class="h-7 flex items-center justify-between mb-1.5">
              <p class="text-[11px] font-semibold text-[#5c6176] uppercase tracking-wider">Choose Background Color</p>
              <div id="selected-color-pill" class="flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-white border border-[#c4cbdf] text-[11px] font-medium text-[#404560] shadow-2xs">
                <span id="selected-color-dot" class="w-3 h-3 rounded-full border border-black/20 bg-[#5f9de8]"></span>
                <span id="selected-color-hex">#5F9DE8</span>
              </div>
            </div>
            
            <!-- Crisp White Card for Color Palette -->
            <div class="rounded-xl bg-white p-3 shadow-sm border border-[#e2e4ee] flex flex-col justify-between h-[340px] w-full max-w-[260px] mx-auto my-auto">
              <!-- Top Row Quick Actions -->
              <div class="flex items-center gap-2 pb-2 border-b border-gray-100">
                <button id="btn-color-trans" type="button" class="flex-1 inline-flex items-center justify-center gap-1.5 py-1 px-2 rounded-lg bg-[#f3f5fa] border border-[#d6dbe9] text-[11px] font-medium text-[#404560] hover:bg-[#e9edf8] hover:border-[#7f8ef0] transition shadow-2xs">
                  <span class="h-3.5 w-3.5 rounded-full border border-black/20 checkerboard-small"></span>
                  Transparent
                </button>
                <button id="btn-color-custom" type="button" class="flex-1 inline-flex items-center justify-center gap-1.5 py-1 px-2 rounded-lg bg-[#f3f5fa] border border-[#d6dbe9] text-[11px] font-medium text-[#404560] hover:bg-[#e9edf8] hover:border-[#7f8ef0] transition shadow-2xs">
                  <span class="h-3.5 w-3.5 rounded-full border border-black/20" style="background: conic-gradient(rgb(255,0,0),rgb(255,204,0),rgb(82,255,0),rgb(0,213,255),rgb(29,77,255),rgb(209,0,255),rgb(255,0,0))"></span>
                  Custom
                </button>
              </div>

              <!-- Color Palette Swatches -->
              <div id="palette-container" class="flex flex-col gap-[5px] justify-between py-1">
                <!-- Color items dynamically rendered via JS -->
              </div>
            </div>
            <input type="color" id="custom-color-input" class="hidden">
          </div>

          <!-- Formal Attire Panel -->
          <div id="attire-panel" class="hidden rounded-[16px] bg-[#f4f4f4] p-3.5 shadow-sm flex flex-col justify-between h-[420px] w-full">
            <div class="h-7 mb-2 flex items-center justify-between">
              <!-- Male / Female Switcher -->
              <div class="flex items-center gap-1 bg-white p-0.5 rounded-full border border-[#c4cbdf] text-xs font-semibold shadow-2xs">
                <button type="button" id="attire-male-btn" class="attire-gender-btn rounded-full px-2.5 py-0.5 bg-[#7f8ef0] text-white">Male</button>
                <button type="button" id="attire-female-btn" class="attire-gender-btn rounded-full px-2.5 py-0.5 text-[#555] hover:bg-gray-100">Female</button>
              </div>

              <!-- Category Filter (All / Suits / Shirts) -->
              <div class="flex items-center gap-1 text-[11px] font-medium" id="attire-cat-filters">
                <button type="button" class="attire-cat-btn px-2 py-0.5 rounded-md bg-[#7f8ef0] text-white font-medium" data-cat="all">All (50)</button>
                <button type="button" class="attire-cat-btn px-2 py-0.5 rounded-md text-[#555] hover:bg-white/80 font-medium" data-cat="suit">Suits</button>
                <button type="button" class="attire-cat-btn px-2 py-0.5 rounded-md text-[#555] hover:bg-white/80 font-medium" data-cat="shirt">Shirts</button>
              </div>
            </div>

            <!-- Attire Selector Grid Container -->
            <div class="rounded-xl border border-[#e2e4ee] bg-white p-2 flex flex-col h-[340px] w-full justify-between">
              <div id="attire-grid" class="grid grid-cols-4 gap-2 overflow-y-auto max-h-[250px] custom-scrollbar p-1">
                <!-- Dynamic attire items rendered via JS -->
              </div>

              <!-- Fit Zoom & Action footer -->
              <div id="attire-adjusters" class="pt-2 border-t border-gray-100 flex items-center justify-between gap-3">
                <div class="flex-1 flex items-center gap-2">
                  <span class="text-[11px] text-gray-500 font-semibold flex items-center gap-1">
                    <svg class="w-3.5 h-3.5 text-[#7f8ef0]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7"/></svg>
                    Zoom
                  </span>
                  <input type="range" id="attire-scale" min="0.6" max="1.6" value="1.0" step="0.01" class="flex-1 accent-[#7f8ef0] h-1.5 cursor-pointer">
                  <span id="label-attire-scale" class="text-[11px] font-bold text-gray-700 w-10 text-right">1.00x</span>
                </div>
                <div class="flex items-center gap-1.5">
                  <button type="button" id="attire-none-btn" class="text-[11px] font-semibold text-red-600 hover:bg-red-50 px-2.5 py-1 border border-red-200 rounded-md transition shadow-2xs">None</button>
                  <button type="button" id="attire-reset-fit-btn" class="text-[11px] font-semibold text-gray-600 hover:text-[#7f8ef0] px-2.5 py-1 border border-gray-200 rounded-md transition shadow-2xs">Reset</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Sizes & A4 Sheet Preview Panel -->
          <div id="sizes-panel" class="hidden rounded-[16px] bg-[#f4f4f4] p-3.5 shadow-sm flex flex-col justify-between h-[420px] w-full">
            <div class="h-7 mb-2 flex items-center gap-2" id="size-options-container">
              <!-- Size pill buttons generated dynamically -->
            </div>

            <!-- Custom Size Input Controls (Shown on Custom Size Images tab) -->
            <div id="custom-size-controls" class="hidden mb-2 rounded-xl bg-white p-2 shadow-2xs border border-[#e2e4ee]">
              <div class="grid grid-cols-3 gap-1.5">
                <div>
                  <label class="block text-[9px] font-semibold text-gray-500 uppercase tracking-tight">Width (in)</label>
                  <input type="number" id="custom-w-input" min="0.5" max="7.8" step="0.1" value="2.0" class="w-full rounded border border-gray-300 px-1.5 py-0.5 text-xs font-semibold text-gray-700 focus:border-[#7f8ef0] focus:outline-none">
                </div>
                <div>
                  <label class="block text-[9px] font-semibold text-gray-500 uppercase tracking-tight">Height (in)</label>
                  <input type="number" id="custom-h-input" min="0.5" max="11.0" step="0.1" value="2.0" class="w-full rounded border border-gray-300 px-1.5 py-0.5 text-xs font-semibold text-gray-700 focus:border-[#7f8ef0] focus:outline-none">
                </div>
                <div>
                  <label class="block text-[9px] font-semibold text-gray-500 uppercase tracking-tight">Quantity</label>
                  <input type="number" id="custom-count-input" min="1" max="40" step="1" value="6" class="w-full rounded border border-gray-300 px-1.5 py-0.5 text-xs font-semibold text-gray-700 focus:border-[#7f8ef0] focus:outline-none">
                  <span id="custom-max-label" class="block text-[8px] text-gray-400 mt-0.5">Max on A4: 6</span>
                </div>
              </div>
            </div>

            <!-- A4 Paper Visualizer -->
            <div class="rounded-md border border-[#d2d2d2] bg-[#ececec] p-2.5 flex items-center justify-center h-[340px] w-full max-w-[240px] mx-auto my-auto">
              <div class="aspect-[210/297] h-full w-auto bg-white p-2 shadow-md flex items-start overflow-hidden relative">
                <div id="a4-grid" class="w-full h-full relative">
                  <!-- Dynamic sheet photo cells -->
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>
  <!-- Error notification -->
  <div id="error-message" class="mx-auto mt-2 max-w-[860px] rounded-lg bg-red-50 p-2 text-center text-xs font-medium text-red-600 hidden"></div>
</section>
